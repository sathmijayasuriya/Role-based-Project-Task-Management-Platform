<div class="change-password-section">
  <div class="section-header">
    <h2>Change password</h2>
    <p class="section-description">Update your password to keep your account secure</p>
  </div>

  <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="password-form">
    <label class="form-field">
      <span>Current password</span>
      <div class="input-shell">
        <mat-icon>lock</mat-icon>
        <input
          class="form-input"
          [type]="showCurrentPassword() ? 'text' : 'password'"
          formControlName="currentPassword"
          autocomplete="current-password"
          placeholder="Enter current password"
        />
        <button
          type="button"
          class="icon-toggle"
          (click)="toggleCurrentPassword()"
          [attr.aria-label]="showCurrentPassword() ? 'Hide current password' : 'Show current password'"
        >
          <mat-icon>{{ showCurrentPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
      @if (passwordForm.get('currentPassword')?.hasError('required') && passwordForm.get('currentPassword')?.touched) {
      <p class="field-error">Current password is required</p>
      }
    </label>

    <label class="form-field">
      <span>New password</span>
      <div class="input-shell">
        <mat-icon>lock_outline</mat-icon>
        <input
          class="form-input"
          [type]="showNewPassword() ? 'text' : 'password'"
          formControlName="newPassword"
          autocomplete="new-password"
          placeholder="Create a strong password"
        />
        <button
          type="button"
          class="icon-toggle"
          (click)="toggleNewPassword()"
          [attr.aria-label]="showNewPassword() ? 'Hide new password' : 'Show new password'"
        >
          <mat-icon>{{ showNewPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
      @if (passwordForm.get('newPassword')?.hasError('required') && passwordForm.get('newPassword')?.touched) {
      <p class="field-error">New password is required</p>
      }
      @if (passwordForm.get('newPassword')?.hasError('minlength') && passwordForm.get('newPassword')?.touched) {
      <p class="field-error">Password must be at least 8 characters</p>
      }
    </label>

    <label class="form-field">
      <span>Confirm new password</span>
      <div class="input-shell">
        <mat-icon>lock_outline</mat-icon>
        <input
          class="form-input"
          [type]="showConfirmPassword() ? 'text' : 'password'"
          formControlName="confirmPassword"
          autocomplete="new-password"
          placeholder="Re-enter new password"
        />
        <button
          type="button"
          class="icon-toggle"
          (click)="toggleConfirmPassword()"
          [attr.aria-label]="showConfirmPassword() ? 'Hide confirmation' : 'Show confirmation'"
        >
          <mat-icon>{{ showConfirmPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
      @if (passwordForm.get('confirmPassword')?.hasError('required') && passwordForm.get('confirmPassword')?.touched) {
      <p class="field-error">Please confirm your new password</p>
      }
      @if (passwordForm.hasError('passwordMismatch') && passwordForm.get('confirmPassword')?.touched) {
      <p class="field-error">Passwords do not match</p>
      }
    </label>

    <div class="form-actions">
      <button
        mat-flat-button
        color="primary"
        class="primary-btn"
        type="submit"
        [disabled]="passwordForm.invalid || isChanging()"
      >
        <mat-icon>{{ isChanging() ? 'hourglass_empty' : 'lock' }}</mat-icon>
        <span>{{ isChanging() ? 'Changing...' : 'Change Password' }}</span>
      </button>
    </div>
  </form>
</div>
